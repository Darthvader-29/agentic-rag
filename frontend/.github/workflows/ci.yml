name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Lint · Format · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # `npm run test` is `vitest run` (one-shot, non-watch). This gates PRs on the
        # ~50 vitest files (auth, streaming lifecycle, http-client refresh, SSE parser,
        # schema contracts) that previously never ran in CI (CODE_REVIEW H-F8 / R20).
        run: npm run test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          NEXT_PUBLIC_FEATURE_STREAMING: "false"
          NEXT_PUBLIC_FEATURE_AUTH: "false"
          NEXT_PUBLIC_FEATURE_BYOK: "false"
          NEXT_PUBLIC_FEATURE_PRESIGNED_UPLOAD: "false"
          NEXT_PUBLIC_FEATURE_RICH_COMPONENTS: "false"

  # R21 / M5 — Playwright E2E against a network-stubbed backend (page.route in the spec).
  # Runs after `quality`; playwright.config.ts's webServer builds + serves the production app with
  # the right NEXT_PUBLIC_* flags (streaming OFF → blocking chat path), then the chromium suite runs.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
