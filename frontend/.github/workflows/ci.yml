name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Lint · Format · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # `npm run test` is `vitest run` (one-shot, non-watch). This gates PRs on the
        # ~50 vitest files (auth, streaming lifecycle, http-client refresh, SSE parser,
        # schema contracts) that previously never ran in CI (CODE_REVIEW H-F8 / R20).
        run: npm run test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          NEXT_PUBLIC_FEATURE_STREAMING: "false"
          NEXT_PUBLIC_FEATURE_AUTH: "false"
          NEXT_PUBLIC_FEATURE_BYOK: "false"
          NEXT_PUBLIC_FEATURE_PRESIGNED_UPLOAD: "false"
          NEXT_PUBLIC_FEATURE_RICH_COMPONENTS: "false"
