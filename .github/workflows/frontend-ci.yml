name: Frontend CI

# Lives at the REPO ROOT so GitHub Actions discovers it (workflows are only picked up from the
# root `.github/workflows/`, never a subdirectory like `frontend/.github/`). Path-filtered to
# `frontend/**` so backend-only changes don't trigger it, and every `run` step executes inside
# `frontend/` via `defaults.run.working-directory`. Mirrors `backend-ci.yml`'s shape.

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  quality:
    name: Lint · Format · Typecheck · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # setup-node is a JS action (not a `run` step) so `working-directory` doesn't apply —
          # point it at the frontend lockfile so the npm cache key is computed correctly.
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # `npm run test` is `vitest run` (one-shot, non-watch). This gates PRs on the
        # ~50 vitest files (auth, streaming lifecycle, http-client refresh, SSE parser,
        # schema contracts) that previously never ran in CI (CODE_REVIEW H-F8 / R20).
        run: npm run test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          NEXT_PUBLIC_FEATURE_STREAMING: "false"
          NEXT_PUBLIC_FEATURE_AUTH: "false"
          NEXT_PUBLIC_FEATURE_BYOK: "false"
          NEXT_PUBLIC_FEATURE_PRESIGNED_UPLOAD: "false"
          NEXT_PUBLIC_FEATURE_RICH_COMPONENTS: "false"

  # R21 / M5 — Playwright E2E against a network-stubbed backend (page.route in the spec).
  # Runs after `quality`; playwright.config.ts's webServer builds + serves the production app with
  # the right NEXT_PUBLIC_* flags (streaming OFF → blocking chat path), then the chromium suite runs.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Report is written under frontend/ (the webServer cwd); upload-artifact is a JS action
          # so its path is repo-root-relative regardless of the `run` working-directory default.
          path: frontend/playwright-report/
          retention-days: 7
